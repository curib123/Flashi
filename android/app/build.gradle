import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def environmentFile = rootProject.file("../.env")
def environment = environmentFile.exists()
        ? new JsonSlurper().parse(environmentFile)
        : [:]

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseSigning = [
        'keyAlias',
        'keyPassword',
        'storeFile',
        'storePassword',
].every { keystoreProperties[it] }

android {
    namespace = "com.curibtech.flashi"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // PDFBox depends on Bouncy Castle for standard PDF encryption.
            // Its post-quantum lookup tables are unrelated to PDF parsing and
            // otherwise add several megabytes to every release artifact.
            excludes += ['org/bouncycastle/pqc/**']
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.curibtech.flashi"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders["admobApplicationId"] =
                environment.ANDROID_ADMOB_APP_ID
                        ?: "ca-app-pub-3940256099942544~3347511713"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig = hasReleaseSigning
                    ? signingConfigs.release
                    : signingConfigs.debug
            shrinkResources = true
            minifyEnabled = true
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro',
            )
        }
    }
}

flutter {
    source = "../.."
}
