name: flashi
description: "Flashi AI — offline-first flashcards, quizzes, and mock exams"
publish_to: 'none'
version: 2.1.0+14

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cross_file: 0.3.4+2
  file_picker: 8.1.7
  flutter_secure_storage: 9.2.4
  google_sign_in: 6.2.2
  http: 1.6.0
  path: 1.9.1
  path_provider: 2.1.5
  share_plus: 10.1.4
  sqflite: 2.4.2
  startapp_sdk: 1.0.1
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.3
  flutter_lints: 5.0.0
  sqflite_common_ffi: 2.3.6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "asset/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - asset/font/Montserrat-Regular.ttf
    - asset/font/Montserrat-Bold.ttf
    - asset/icon/icon.png
    - asset/images/onboarding_1.png
    - asset/images/onboarding_2.png
    - asset/images/onboarding_3.jpg
    - asset/images/onboarding_4.jpg
  fonts:
    - family: Montserrat
      fonts:
        - asset: asset/font/Montserrat-Regular.ttf
        - asset: asset/font/Montserrat-Bold.ttf
          weight: 700
