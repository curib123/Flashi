name: flashi
description: "Offline-first flashcard and quiz maker"
publish_to: 'none'
version: 1.6.3+12

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  flex_color_scheme: ^8.0.2
  provider: ^6.1.0
  google_fonts: ^5.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  flutter_tts: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  flip_card: ^0.7.0
  curved_navigation_bar: ^1.0.6
  elegant_notification: ^2.4.1
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  introduction_screen: ^3.1.14
  url_launcher: ^6.3.1
  internet_connection_checker_plus: ^2.7.0
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.2.1
  flutter_animate: ^4.5.2
  dart_levenshtein: ^1.0.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  email_validator: ^3.0.0
  http: 1.6.0
  supabase_flutter: 2.15.4
  google_sign_in: 6.2.2
  startapp_sdk: 1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "asset/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - asset/font/Montserrat-Regular.ttf
    - asset/font/Montserrat-Bold.ttf
    - asset/icon/icon.png
    - asset/images/onboarding_1.png
    - asset/images/onboarding_2.png
    - asset/images/onboarding_3.jpg
    - asset/images/onboarding_4.jpg

  fonts:
    - family: Montserrat
      fonts:
        - asset: asset/font/Montserrat-Regular.ttf
        - asset: asset/font/Montserrat-Bold.ttf
          weight: 500
